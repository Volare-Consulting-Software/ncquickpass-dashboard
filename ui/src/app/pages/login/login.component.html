<div class="login-wrap">
  <form class="login-card" (ngSubmit)="submit()">
    <app-ncqp-logo class="login-logo" [height]="40" />
    <p class="subtitle">Dashboard</p>

    @if (error(); as err) {
      <div class="alert" role="alert">{{ err }}</div>
    }

    <label>
      <span>Username</span>
      <input
        name="username"
        type="text"
        autocomplete="username"
        [(ngModel)]="username"
        [disabled]="loading()"
        required
      />
    </label>

    <label>
      <span>Password</span>
      <span class="password-field">
        <input
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          [(ngModel)]="password"
          [disabled]="loading()"
          required
        />
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [disabled]="loading()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
          [title]="showPassword() ? 'Hide password' : 'Show password'"
        >
          <app-eye-icon [size]="18" [crossed]="showPassword()" />
        </button>
      </span>
    </label>

    <button type="submit" [disabled]="loading() || !username || !password">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="fineprint">
      By default your credentials are not stored, unless you opt into background processes that use
      your encrypted credentials. <a href="/how-it-works" target="_blank" rel="noopener">Read more</a>.
    </p>

    <p class="built-by">
      Powered by
      <a
        class="volare-inline-link"
        href="https://go-volare.com"
        target="_blank"
        rel="noopener"
        aria-label="Volare — go-volare.com (opens in a new tab)"
      >
        <img class="volare-inline" src="assets/volare-logo.png" alt="Volare" />
      </a>
    </p>
  </form>
</div>
